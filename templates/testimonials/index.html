{% extends "base.html" %}
{% block title %}Testimonials{% endblock %}
{% block content %}
<section class="section">
  <h1 class="h2">Testimonials</h1>
  <ul class="list-plain">
    {% for t in items %}
      <li class="card">
        <p>"{{ t.quote }}"</p>
        <p><strong>— {{ t.name }}</strong> · {{ t.rating }}/5</p>
      </li>
    {% empty %}
      <li>No testimonials yet.</li>
    {% endfor %}
  </ul>
</section>
{% endblock %}
