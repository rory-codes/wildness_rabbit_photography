{% extends "base.html" %}
{% block content %}
<section class="section">
  <article class="photo-detail">
    <img src="{{ photo.image.url }}" alt="{{ photo.title }}">
    <div>
      <h1 class="h1">{{ photo.title }}</h1>
      <p>{{ photo.description }}</p>
      <p><strong>Quality:</strong> {{ photo.get_quality_display }}</p>

      <h3 class="h2">Purchase options</h3>
      <ul class="list-plain">
        {% for v in variants %}
        <form method="post" action="{% url 'cart:add' v.id %}">
          {% csrf_token %}
          <div class="d-flex gap-2 align-items-end">
            <div>
              <div>{{ v.name }}</div>
              <div>£{{ v.price }}</div>
            </div>
            <input type="number" name="qty" min="1" value="1" class="form-control" style="max-width:90px">
            <button class="btn btn-primary">Add to cart</button>
          </div>
        </form>
        <hr>
        {% endfor %}

      </ul>
    </div>
  </article>
</section>
{% endblock %}
