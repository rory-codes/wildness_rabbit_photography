{# templates/account/login.html #}
{% extends "base.html" %}
{% load i18n crispy_forms_tags %}
{% block content %}
<div class="container py-5" style="max-width: 520px">
  <h1 class="h3 mb-4">{% trans "Log in" %}</h1>
  <form method="post" action="{% url 'account_login' %}">
    {% csrf_token %}
    {{ form|crispy }}
    <button class="btn btn-primary w-100 mt-2">{% trans "Log in" %}</button>
  </form>
  <p class="mt-3"><a href="{% url 'account_reset_password' %}">{% trans "Forgot password?" %}</a></p>
  <p class="mt-2">{% trans "New here?" %} <a href="{% url 'account_signup' %}">{% trans "Create an account" %}</a></p>
</div>
{% endblock %}
