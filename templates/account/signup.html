{# templates/account/signup.html #}
{% extends "base.html" %}
{% load i18n crispy_forms_tags %}
{% block content %}
<div class="container py-5" style="max-width: 520px">
  <h1 class="h3 mb-4">{% trans "Sign up" %}</h1>
  <form method="post" action="{% url 'account_signup' %}">
    {% csrf_token %}
    {{ form|crispy }}
    <button class="btn btn-primary w-100 mt-2">{% trans "Create account" %}</button>
  </form>
  <p class="mt-3">{% trans "Already have an account?" %} <a href="{% url 'account_login' %}">{% trans "Log in" %}</a></p>
</div>
{% endblock %}
