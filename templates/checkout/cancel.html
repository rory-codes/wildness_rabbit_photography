{% extends "base.html" %}

{% block content %}
<section class="section">
  <h1 class="h2">Payment cancelled</h1>
  <p>Your checkout was cancelled. No payment has been taken.</p>

  <div class="mt-3" style="display:flex; gap:12px; flex-wrap:wrap;">
    <a href="{% url 'cart:detail' %}" class="btn">Return to bag</a>
    <a href="{% url 'catalog:index' %}" class="btn">Continue shopping</a>
  </div>

  <p class="mt-3" style="max-width:640px;">
    If you didn’t mean to cancel, you can start checkout again from your shopping bag.
  </p>
</section>
{% endblock %}
